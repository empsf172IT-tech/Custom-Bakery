<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baker Login - Crumb & Canvas</title>
    <script>
        // Apply theme immediately to prevent flash
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        vanilla: '#FFF4D6',
                        cocoa: '#4A2924',
                        apricot: '#F4A261'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="antialiased selection:bg-apricot selection:text-vanilla flex flex-col min-h-screen">

    <main class="flex-grow flex items-center justify-center py-20 px-4 relative overflow-hidden">
        <div class="absolute inset-0 z-0 opacity-20 dark:opacity-10">
            <img src="https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&q=80&w=1920" alt="Bakery Background" class="w-full h-full object-cover">
        </div>

        <!-- Theme Toggle Absolute -->
        <button id="themeToggle"
            class="absolute top-6 right-6 z-20 theme-donut p-2 rounded-full hover:bg-cocoa/5 dark:hover:bg-vanilla/5 focus:outline-none bg-vanilla/50 dark:bg-cocoa/50 backdrop-blur-md"
            aria-label="Toggle Theme">
            <div id="donutIcon" class="flex items-center justify-center"></div>
        </button>
        
        <div class="relative z-10 w-full max-w-md">
            <div class="card p-8 md:p-12 shadow-2xl bg-vanilla/95 dark:bg-cocoa/95 backdrop-blur-md border border-apricot/20">
                <div class="text-center mb-8">
                    <a href="index.html" class="inline-flex items-center gap-2 group mb-4">
                        <svg class="w-12 h-12 fill-apricot transform group-hover:rotate-12 transition-transform duration-300"
                            viewBox="0 0 24 24">
                            <path
                                d="M12,2A2,2 0 0,1 14,4C14,5.11 13.1,6 12,6C10.9,6 10,5.11 10,4A2,2 0 0,1 12,2M7,12A2,2 0 0,0 9,14A2,2 0 0,0 11,12V10H13V12A2,2 0 0,0 15,14A2,2 0 0,0 17,12V8H7V12M19,16H5V20H19V16M21,16C21,14.9 20.1,14 19,14H18V9A1,1 0 0,0 17,8H15V6.63C15.63,6.23 16,5.54 16,4A4,4 0 0,0 12,0A4,4 0 0,0 8,4C8,5.54 8.37,6.23 9,6.63V8H7A1,1 0 0,0 6,9V14H5C3.9,14 3,14.9 3,16V20C3,21.1 3.9,22 5,22H19C20.1,22 21,21.1 21,20V16Z" />
                        </svg>
                        <span class="font-serif font-bold text-3xl text-cocoa dark:text-vanilla">Crumb & Canvas</span>
                    </a>
                    <p class="text-sm text-cocoa/70 dark:text-vanilla/70">Sign in to the Baker Dashboard.</p>
                </div>
                
                <form action="dashboard.html" method="GET" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-semibold mb-2 text-cocoa dark:text-vanilla">Email Address</label>
                        <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-cocoa/20 dark:border-vanilla/20 bg-white/50 dark:bg-[#5a3630]/50 focus:outline-none focus:border-apricot transition-colors text-cocoa dark:text-vanilla" placeholder="baker@crumbandcanvas.com">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-semibold mb-2 text-cocoa dark:text-vanilla">Password</label>
                        <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl border border-cocoa/20 dark:border-vanilla/20 bg-white/50 dark:bg-[#5a3630]/50 focus:outline-none focus:border-apricot transition-colors text-cocoa dark:text-vanilla" placeholder="••••••••">
                    </div>
                    
                    <div class="flex items-center justify-between text-sm">
                        <label class="flex items-center gap-2 cursor-pointer text-cocoa dark:text-vanilla">
                            <input type="checkbox" class="rounded text-apricot focus:ring-apricot border-cocoa/20 bg-transparent">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="text-apricot hover:underline font-medium">Forgot Password?</a>
                    </div>
                    
                    <button type="submit" class="w-full btn-primary py-3 mt-4 text-lg font-bold">Sign In &rarr;</button>
                </form>

                <div class="mt-8">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-cocoa/20 dark:border-vanilla/20"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-[#fdf3d8] dark:bg-[#4d2c26] text-cocoa/60 dark:text-vanilla/60 rounded-md">Or continue with</span>
                        </div>
                    </div>

                    <div class="mt-6 grid grid-cols-2 gap-4">
                        <a href="dashboard.html" class="flex items-center justify-center gap-2 px-4 py-3 border border-cocoa/20 dark:border-vanilla/20 rounded-xl hover:bg-cocoa/5 dark:hover:bg-vanilla/5 transition-colors text-cocoa dark:text-vanilla font-semibold">
                            <svg class="w-5 h-5" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                            Google
                        </a>
                        <a href="dashboard.html" class="flex items-center justify-center gap-2 px-4 py-3 border border-cocoa/20 dark:border-vanilla/20 rounded-xl hover:bg-cocoa/5 dark:hover:bg-vanilla/5 transition-colors text-cocoa dark:text-vanilla font-semibold">
                            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                                <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.04 2.26-.79 3.59-.76 1.56.04 2.87.69 3.61 1.76-3.2 1.83-2.61 5.92.51 7.15-.75 1.83-1.68 3.19-2.79 3.99v.03zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.02 4.41-3.74 4.25z"/>
                            </svg>
                            Apple
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
